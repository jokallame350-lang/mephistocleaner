name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Portable Zip Bundle & Checksums
        shell: pwsh
        run: |
          $files = @("MephistoCleaner.exe", "MephistoCleaner.ps1", "MephistoCleaner.bat", "MephistoCleaner.vbs", "README.md", "LICENSE", "DISCLAIMER.md")
          Compress-Archive -Path $files -DestinationPath "MephistoCleaner-Portable.zip" -Force
          $shaZip = (Get-FileHash -Path "MephistoCleaner-Portable.zip" -Algorithm SHA256).Hash
          $shaSetup = if (Test-Path "dist/MephistoCleaner-Setup-v7.0.exe") { (Get-FileHash -Path "dist/MephistoCleaner-Setup-v7.0.exe" -Algorithm SHA256).Hash } else { "N/A" }
          $shaExe = if (Test-Path "MephistoCleaner.exe") { (Get-FileHash -Path "MephistoCleaner.exe" -Algorithm SHA256).Hash } else { "N/A" }
          
          $checksumContent = @"
SHA256 (MephistoCleaner-Setup-v7.0.exe) = $shaSetup
SHA256 (MephistoCleaner-Portable.zip) = $shaZip
SHA256 (MephistoCleaner.exe) = $shaExe
"@
          Set-Content -Path "checksums.txt" -Value $checksumContent

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MephistoCleaner v7.0.0 Ultimate — Live HUD, Software Hub, Presets & 20 Languages"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/MephistoCleaner-Setup-v7.0.exe
            MephistoCleaner-Portable.zip
            MephistoCleaner.exe
            checksums.txt
          body: |
            # ⚡ MephistoCleaner v7.0.0 Ultimate — Official Major Release
            
            > **The Ultimate All-in-One Open-Source Windows 10 & 11 Gaming, Privacy, Debloating & Optimization Suite.**
            > Featuring **150+ Modular Tweaks**, **8 Dedicated Tabs**, a **Real-Time Live Hardware HUD**, an **Instant Search Bar**, **1-Click Presets**, a visual **Software Hub**, **20 Native Languages**, and **10 Dynamic Themes**.

            ---

            ### 🚀 What's New in v7.0.0 Ultimate

            * 📊 **Real-Time Live Hardware HUD Dashboard:** Visual live monitoring for **CPU Load & MHz**, **RAM Usage (% & GB)**, **C: Free Space**, and **GPU Status** updated continuously every 2 seconds without UI freeze.
            * 🔍 **Instant Search & Filter Bar:** Type any keyword in any language (e.g. `DNS`, `RAM`, `CS2`, `Oyun`, `Defender`, `Telemetry`) to dynamically filter all 150+ features in real-time.
            * 🎯 **1-Click Curated Presets:**
              * 🎮 **Espor / Gamer Preset:** Unparks cores, sets `MaxFrameLatency=1`, `Win32PrioritySeparation=38`, 0ms input lag, and HAGS GPU scheduling.
              * 🛡️ **Privacy & Debloat Preset:** Systemwide disable of Copilot AI, DiagTrack telemetry, Bing cloud search, Advertising ID, and lockscreen promotions.
              * 🧹 **Deep Disk Clean Preset:** Instant purge of GPU shader caches (NVIDIA/AMD/DirectX), temporary junk, crash dumps, and SSD TRIM.
              * 💾 **Profile Export/Import:** Save and share customized `.json` configuration profiles.
            * 📦 **Software Hub (Winget 1-Click Package Manager - Tab 8):** Bulk install developer runtimes (**Visual C++ All-in-One 2005–2022**), Steam, Discord, OBS Studio, MSI Afterburner, 7-Zip, Notepad++, Git, Python, Brave, and VLC.
            * 🚀 **Native Standalone Executable (`MephistoCleaner.exe`):** 0.1s instant startup with embedded metadata, custom cyber flame icon, and zero console window flash.
            * 🎨 **Official Setup Wizard (`MephistoCleaner-Setup-v7.0.exe`):** Lightweight Inno Setup installer with automatic Start Menu/Desktop shortcuts and complete clean uninstaller.
            * 🌐 **20 Languages & 10 Dynamic Themes:** Full dynamic localization across English, Turkish, German, French, Spanish, Russian, Japanese, Simplified Chinese, and 12 more languages.
            * 🛡️ **100% Safe & Reversible:** Built-in **Instant Restore Point Creation (#149)** and **Factory Defaults Revert (#150)**.

            ---

            ### 📦 Download Files

            * 🛡️ **`MephistoCleaner-Setup-v7.0.exe`** — Official Windows Setup Wizard (Installer with Start/Desktop shortcuts)
            * 🚀 **`MephistoCleaner.exe`** — Standalone C# Executable (No console flash, instant 0.1s startup)
            * 📦 **`MephistoCleaner-Portable.zip`** — Portable bundle (Extract and run anywhere)
            * 🔐 **`checksums.txt`** — SHA256 integrity verification hashes
