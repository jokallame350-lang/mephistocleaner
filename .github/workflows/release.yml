name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Portable Zip Bundle
        shell: pwsh
        run: |
          $files = @("MephistoCleaner.ps1", "MephistoCleaner.bat", "MephistoCleaner.vbs", "README.md", "LICENSE", "DISCLAIMER.md")
          Compress-Archive -Path $files -DestinationPath "MephistoCleaner-Portable.zip" -Force
          $sha256 = (Get-FileHash -Path "MephistoCleaner-Portable.zip" -Algorithm SHA256).Hash
          Write-Host "Zip SHA256: $sha256"
          Set-Content -Path "checksums.txt" -Value "SHA256 (MephistoCleaner-Portable.zip) = $sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MephistoCleaner v6.0.0 - The Ultimate Windows 10 & 11 Gaming, Privacy & Optimization Suite"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            MephistoCleaner-Portable.zip
            checksums.txt
          body: |
            # ⚡ MephistoCleaner v6.0.0 — Official Stable Release
            
            > **The Ultimate Open-Source Windows 10 & 11 Gaming, Low Latency, Privacy & Debloating Suite.**
            > Featuring **150+ Safe Modular Tweaks**, **20 Native Languages**, **10 Dynamic Themes**, and a **Zero-Console Standalone WPF GUI**.

            ---

            ### 🚀 Highlights & New Features in v6.0.0

            * **🖱️ Standalone Zero-Console WPF GUI:** Fully mouse-driven interface with real-time **hover ToolTips** on all 150 buttons explaining what each tweak does.
            * **⚡ 1-Click Master Optimization:** Curated 1-click suite to optimize CPU power plans, unpark cores, set `MaxFrameLatency=1`, enable HAGS, flush caches, and trim SSD storage.
            * **🌐 20 Native Languages:** Full dynamic UI translation across English, Turkish, German, French, Spanish, Italian, Russian, Japanese, Simplified Chinese, Korean, Portuguese, Polish, Dutch, Arabic, Hindi, Swedish, Greek, Romanian, Ukrainian, and Vietnamese.
            * **🎨 10 Dynamic Color Themes:** Instant theme switching between *Cyber Slate*, *Midnight Velvet*, *Matrix Emerald*, *Crimson Blood*, *Sunset Amber*, *AMOLED Pure Black*, *Dracula Dusk*, *Nordic Frost*, *Sakura Bloom*, and *Solarized Dark*.
            * **🛡️ 100% Safe & Reversible:** Complete system integrity preservation with built-in **System Restore Point Creation (#149)** and **Factory Defaults Revert (#150)**.
            * **💽 Deep Disk Recovery:** Automatically purges multi-gigabyte corrupted DirectX, NVIDIA DXCache, and AMD DxCache stores, dispatches hardware TRIM, and cleans temporary junk.
            * **🌐 Latency & Ping Engine:** Eliminates Nagle's algorithm (`TCPNoDelay=1`), enables TCP FastOpen, ECN, RSS, and applies 1:1 hardware raw mouse input.

            ---

            ### 📦 Quick Download & Run

            #### Option A: One-Liner PowerShell (No Download Required)
            ```powershell
            irm https://raw.githubusercontent.com/jokallame350-lang/mephistocleaner/master/MephistoCleaner.ps1 | iex
            ```

            #### Option B: Download Portable Bundle
            1. Download **`MephistoCleaner-Portable.zip`** below.
            2. Extract anywhere on your PC.
            3. Double-click **`MephistoCleaner.vbs`** or **`MephistoCleaner.bat`** to launch!

            ---

            ### 🔍 High-Ranking Search Keywords & SEO Tags

            `windows-11-optimization` `windows-10-optimization` `debloat-windows-11` `fps-boost` `low-latency` `input-lag-fix` `game-booster` `cs2-fps-boost` `valorant-latency` `winutil-alternative` `sophia-script` `atlasos-alternative` `pc-tweaker` `windows-debloater` `powershell-gui` `nvidia-latency-fix` `tcp-optimizer` `dns-switcher` `ssd-trim-tool` `windows-privacy`
