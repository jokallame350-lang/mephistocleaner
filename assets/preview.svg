    <rect x="15" y="195" width="295" height="34" rx="4" fill="#0F141C" stroke="#334155"/>
    <text x="25" y="216" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">13. Set Win32PrioritySeparation to 38</text>

    <rect x="330" y="195" width="295" height="34" rx="4" fill="#0F141C" stroke="#334155"/>
    <text x="340" y="216" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">14. Set MMCSS GPU Priority to 8 (High)</text>

    <rect x="645" y="195" width="295" height="34" rx="4" fill="#0F141C" stroke="#334155"/>
    <text x="655" y="216" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">15. Get Competitive CS2 Launch Options</text>
