    <text x="15" y="42" font-family="Consolas, monospace" font-size="11" fill="#10B981">[21:30:01] Hardware detected: AMD Ryzen 7 / Intel Core (32.0 GB RAM) | Dedicated GPU Active.</text>
    <text x="15" y="62" font-family="Consolas, monospace" font-size="11" fill="#38BDF8">[21:30:05] Hover your mouse over any button to view a detailed real-time explanation.</text>
    <text x="15" y="82" font-family="Consolas, monospace" font-size="11" fill="#10B981">[21:30:10] Ready for 1-Click Master Optimization or granular custom selection.</text>
