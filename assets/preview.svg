  <circle cx="20" cy="19" r="6" fill="#EF4444"/>
  <circle cx="38" cy="19" r="6" fill="#F59E0B"/>
  <circle cx="56" cy="19" r="6" fill="#10B981"/>
  <text x="500" y="24" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">
